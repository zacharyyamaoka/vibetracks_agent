# The blackbox_agent package builds and deploys this box's site on every push to main (its README, "Deploy").
# WHY on push again (2026-11-25): Zach made the repo public ("Ok please make this a public repo", Daily Note Nov 24),
# so Pages is free; the source is "GitHub Actions". It was manual-only while private (Pages on a private repo is paid).
name: pages
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: read, pages: write, id-token: write}
jobs:
  site:
    uses: zacharyyamaoka/blackbox_agent/.github/workflows/site.yml@v0
