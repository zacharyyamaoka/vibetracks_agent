[project]
name = "vibetracks-agent"
version = "0.1.0"
description = "Vibe Tracks as a black box: the frozen spec (ruler v1), its acceptance run, and a committed ledger of scored vibetracks commits."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vta = "vibetracks_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibetracks_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
